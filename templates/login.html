<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>

        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: Arial, sans-serif;
                background: #f5f7fb;
            }

            .form-container {
                width: 360px;
                padding: 32px;
                background: white;
                border-radius: 12px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            }

            h1 {
                margin-bottom: 24px;
                text-align: center;
            }

            label {
                display: block;
                margin-bottom: 8px;
                font-weight: bold;
            }

            input {
                width: 100%;
                padding: 12px;
                margin-bottom: 18px;
                border: 1px solid #ccc;
                border-radius: 7px;
                font-size: 16px;
            }

            input[type="submit"] {
                background: #171717;
                color: white;
                border: none;
                cursor: pointer;
                margin-top: 5px;
            }

            input[type="submit"]:hover {
                opacity: 0.85;
            }
        </style>
    </head>

    <body>

        <div class="form-container">
            <h1>Login</h1>

            <form method="POST" action="/">
                <label for="username">Username:</label>
                <input
                    name="username"
                    id="username"
                    type="text"
                >
                {%asd%}
                <label for="password">Password:</label>
                <input
                    name="password"
                    id="password"
                    type="password"
                >

                <input
                    type="submit"
                    value="Login"
                >
            </form>
        </div>

    </body>
    </html>
