<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #171717;
        }

        .welcome {
            text-align: center;
        }

        h1 {
            font-size: 56px;
            margin-bottom: 12px;
        }

        p {
            font-size: 18px;
            color: #666;
            margin-bottom: 28px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            background: #171717;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .logout {
            background: #e5484d;
        }
    </style>
</head>

<body>
    <main class="welcome">
        <h1>Welcome {session["user"]} 👋</h1>

        <p>We're glad you're here.</p>

        <div class="buttons">
            <a href="#" class="button">Get Started</a>
            <a href="{url_for('logout')}" class="button logout">Logout</a>
        </div>
    </main>
</body>
</html>
